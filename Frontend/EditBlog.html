<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Blog</title>

    <link rel="stylesheet" href="Style.css">
    <link rel="icon" href="data:,">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
    <div class="nav-links">
      <a href="Index.html" class="nav-btn ">Home</a>
      <a href="Blog.html" class="nav-btn">Blog</a>
    </div>
  </nav>



    <!-- Edit Blog Form -->

    <div class="form-section">

        <h1 id="formTitle">
            ✏️ Edit Blog
        </h1>

        <p id="formSubtitle">
            Update your existing blog post
        </p>


        <form id="blogForm">

            <input
                type="hidden"
                id="blogId"
            >


            <label for="title">
                Blog Title
            </label>

            <input
                type="text"
                id="title"
                placeholder="Enter blog title"
                required
            >


            <label for="author">
                Author
            </label>

            <input
                type="text"
                id="author"
                placeholder="Enter author name"
                required
            >


            <label for="description">
                Description
            </label>

            <textarea
                id="description"
                placeholder="Enter blog description"
                rows="6"
                required
            ></textarea>


            <button
                type="submit"
                id="submitButton"
                class="submit-btn">

                🔄 Update Blog

            </button>


            <button
                type="button"
                class="cancel-btn"
                onclick="window.location.href='Index.html'">

                ❌ Cancel

            </button>

        </form>

    </div>


    <script src="script.js"></script>
     <!-- Footer Section -->
   <footer class="footer">
    <p>&copy; 2026 My Blog Website | FullStack Development Internship </p>
  </footer>

</body>

</html>
